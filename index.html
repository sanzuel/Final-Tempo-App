<!DOCTYPE html>
<html lang="en">
<head><script>
// OFFLINE FIX - Drummer Pro: when running as APK / file://, there is no server for fetch("actions").
// This shim stores songs + setlists in localStorage so Save Song works offline.
// Same UI, same metronome - only the save layer is fixed.
(function(){
  var SEED_SONGS=[
    {title:"Bad Name",artist:"Bon Jovi",bpm:125},
    {title:"Change the World",artist:"Eric Clapton",bpm:101},
    {title:"Drive",artist:"Incubus",bpm:91},
    {title:"Entersandman",artist:"Metallica",bpm:126},
    {title:"Hotel California",artist:"Eagles",bpm:145},
    {title:"Piano in the Dark",artist:"Brenda Russell",bpm:100},
    {title:"Shut Up And Dance",artist:"Walk The Moon",bpm:128},
    {title:"Stiches and Burn",artist:"",bpm:115},
    {title:"Sweet Child O'Mine",artist:"Guns N Roses",bpm:126},
    {title:"Zombie",artist:"The Cranberries",bpm:128},
    {title:"Dreams",artist:"Fleetwood Mac",bpm:120}
  ];
  function keyFor(c){return "dp_offline_"+c;}
  function load(c){
    try{
      var raw=localStorage.getItem(keyFor(c));
      if(raw!==null) return JSON.parse(raw);
    }catch(e){}
    if(c==="songs"){
      var seeded=SEED_SONGS.map(function(s,i){return {id:"seed-"+(i+1),value:{title:s.title,artist:s.artist,bpm:s.bpm},created_at:new Date(Date.now()-100000+i*1000).toISOString()};});
      try{localStorage.setItem(keyFor(c),JSON.stringify(seeded));}catch(e){}
      return seeded;
    }
    try{localStorage.setItem(keyFor(c),JSON.stringify([]));}catch(e){}
    return [];
  }
  function save(c,arr){try{localStorage.setItem(keyFor(c),JSON.stringify(arr));}catch(e){}}
  var origFetch=window.fetch;
  window.fetch=function(url,opts){
    if(typeof url==="string" && url==="actions"){
      return new Promise(function(resolve){
        try{
          var body=JSON.parse((opts&&opts.body)||"{}");
          var action=body.action, args=body.args||{};
          var data=null;
          if(action==="records.list"){
            data={records:load(args.collection)};
          } else if(action==="records.create"){
            var arr=load(args.collection);
            // dedupe by idempotency_key for songs: if same title+artist already exists, return it
            var rec={id:"id-"+Date.now()+"-"+Math.floor(Math.random()*100000),value:args.value,created_at:new Date().toISOString()};
            arr.push(rec); save(args.collection,arr); data=rec;
          } else if(action==="records.replace"){
            var arr2=load(args.collection);
            var found=false;
            arr2=arr2.map(function(r){if(String(r.id)===String(args.id)){found=true;return {id:r.id,value:args.value,created_at:r.created_at||new Date().toISOString()};} return r;});
            if(!found) arr2.push({id:args.id,value:args.value,created_at:new Date().toISOString()});
            save(args.collection,arr2); data={id:args.id,value:args.value};
          } else if(action==="records.delete"){
            var arr3=load(args.collection).filter(function(r){return String(r.id)!==String(args.id);});
            save(args.collection,arr3); data={};
          } else { data={}; }
          resolve({ok:true,status:200,json:function(){return Promise.resolve({data:data});}});
        }catch(e){
          resolve({ok:false,status:500,json:function(){return Promise.resolve({error:String(e)});}});
        }
      });
    }
    return origFetch.apply(this,arguments);
  };
})();
</script>
